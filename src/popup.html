<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Thin Book</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/mdb.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-2" style="width: 180px; height: 200px;">
        <div class="d-flex justify-content-end mb-2">
            <button class="btn btn-link p-1" id="options-btn">
                <i class="fas fa-cog fa-lg text-muted"></i>
            </button>
        </div>
        <div class="d-flex flex-column align-items-center">
            <button class="btn btn-primary btn-lg mb-3" id="copy-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; box-shadow: 0 4px 15px 0 rgba(116, 79, 168, 0.75);">
                <i class="fas fa-copy fa-3x"></i>
            </button>
            <div id="status" class="text-success font-weight-bold" style="min-height: 1rem;"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
